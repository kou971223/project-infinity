name: Keyless chat and mobile browser verification
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pinf-browser-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated browser-test tools
        run: |
          python3 -m venv .browserenv
          .browserenv/bin/pip install --no-cache-dir playwright==1.56.0
          .browserenv/bin/python -m playwright install --with-deps chromium webkit
      - name: Real remote inference, two turns, history and mobile layout
        run: |
          node continuity/service.js > /tmp/pinf-browser-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/health && break; sleep 1; done
          .browserenv/bin/python test/browser_recovery.py
          .browserenv/bin/python test/browser_check.py
          BROWSER_ENGINE=webkit .browserenv/bin/python test/browser_check.py
