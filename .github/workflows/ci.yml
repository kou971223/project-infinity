name: Core verification
on:
  push:
    branches: [main, 'candidate/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - run: npm run verify:cycle
      - run: npm run verify:oracle
      - run: npm run research
      - run: cat reports/python-oracle-result.json
