name: Research memory and generated programs
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  pull_request:
    branches: [main]
    paths: ['research/**', '.github/workflows/research-memory.yml']
  workflow_run:
    workflows: ['Published site exact-revision verification']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: research-memory-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  propose:
    if: github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      data: ${{ steps.pack.outputs.data }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: python3 research/cycle.py propose
      - id: pack
        run: |
          python3 - <<'PY'
          import pathlib,base64,os
          data=pathlib.Path('reports/research-v2.json').read_bytes();assert len(data)<120000
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('data='+base64.b64encode(data).decode()+'\n')
          PY
  independent:
    needs: propose
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    outputs:
      data: ${{ steps.pack.outputs.data }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - env:
          DATA: ${{ needs.propose.outputs.data }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib
          data=base64.b64decode(os.environ['DATA'],validate=True);assert len(data)<120000;json.loads(data)
          pathlib.Path('reports').mkdir(exist_ok=True);pathlib.Path('reports/research-v2.json').write_bytes(data)
          PY
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: python3 research/cycle.py validate
      - id: pack
        run: |
          python3 - <<'PY'
          import pathlib,base64,os
          data=pathlib.Path('reports/research-v2.json').read_bytes();assert len(data)<120000
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('data='+base64.b64encode(data).decode()+'\n')
          PY
  preserve:
    needs: independent
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - env:
          DATA: ${{ needs.independent.outputs.data }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib
          data=base64.b64decode(os.environ['DATA'],validate=True);assert len(data)<120000;json.loads(data)
          pathlib.Path('reports').mkdir(exist_ok=True);pathlib.Path('reports/research-v2.json').write_bytes(data)
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 research/cycle.py publish
