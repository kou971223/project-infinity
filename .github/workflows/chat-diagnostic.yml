name: Non-promoting inference runtime diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['candidate/core-0.7-chat-learning']
    paths: ['test/chat_runtime_diagnostic.py','.github/workflows/chat-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          python3 -m venv .diag
          .diag/bin/pip install --no-cache-dir onnxruntime==1.23.2 transformers==4.57.1 numpy==2.2.6 playwright==1.56.0 jinja2==3.1.6
          .diag/bin/python -m playwright install --with-deps chromium
      - name: Compare runtime outputs; no publisher, tokens, thresholds or promotion
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          node chatlearn/app.js >/tmp/pinf-diag.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 1
          .diag/bin/python test/chat_runtime_diagnostic.py
