name: Published site exact-revision verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pinf-published-browser-check
  cancel-in-progress: true
jobs:
  live-browser:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Wait for the exact main commit to be live
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 -u - <<'PY'
          import json,os,time,urllib.request
          expected=os.environ['EXPECTED_REVISION']
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('https://project-infinity-core.onrender.com/health',timeout=20) as r: x=json.load(r)
                  if x['revision']==expected and x['version']=='0.8.0':
                      print(json.dumps(x));break
              except Exception as e: print(type(e).__name__)
              time.sleep(10)
          else: raise SystemExit('DEPLOY_REVISION_NOT_OBSERVED')
          PY
      - name: Install isolated browser tools
        run: |
          python3 -m venv .browserenv
          .browserenv/bin/pip install --no-cache-dir playwright==1.56.0
          .browserenv/bin/python -m playwright install --with-deps chromium webkit
      - name: Real two turns, mobile history and production API
        env:
          BROWSER_BASE_URL: https://project-infinity-core.onrender.com
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          .browserenv/bin/python test/browser_check.py
          BROWSER_ENGINE=webkit .browserenv/bin/python test/browser_check.py
