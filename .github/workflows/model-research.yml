# Legacy single-pass experiment retained for reproduction, not a duplicate schedule.
name: Free CPU model research and learning
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinf-free-model-research
  cancel-in-progress: false
jobs:
  cpu:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      record: ${{ steps.record.outputs.record }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - name: Install pinned CPU-only learning dependencies (no API key)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install --no-cache-dir transformers==4.57.1 safetensors==0.6.2
      - name: Actual local model generation and partial pretrained-weight training
        id: learning
        continue-on-error: true
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: .venv/bin/python experiments/local_research.py
      - name: Validate generated code as data in the existing sandbox
        run: node src/model-researcher.js
      - name: Package bounded public evidence (no artifact storage billing)
        id: record
        if: always()
        run: node src/package-research.js
      - name: Require actual learning execution for a successful job
        if: steps.learning.outcome != 'success'
        run: exit 1
  preserve-public-evidence:
    needs: cpu
    if: always() && needs.cpu.outputs.record != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preserve evidence on data-only branch; never main
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECORD_B64: ${{ needs.cpu.outputs.record }}
        run: node src/publish-research.js
